<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>BusDirect</title>
    <meta
      name="description"
      content="BusDirect un site degestion des réservations de sièges pour les trajets entre les villes safi et marrakech"
    />

    <link rel="stylesheet" href="./src/output.css" />
  </head>

  <body class="flex min-h-screen flex-col bg-yellow-50 text-yellow-950">
    <header class="bg-yellow-100 shadow-md">
      <nav
        class="mx-auto flex max-w-7xl items-center gap-3 px-3 py-3 sm:px-6 lg:px-8"
      >
        <img
          src="./logo.png"
          alt="BusDirect logo"
          class="h-12 w-12 object-contain sm:h-16 sm:w-16"
        />
        <div class="min-w-0">
          <h1
            class="text-xl font-extrabold tracking-tight text-blue-950 sm:text-2xl"
          >
            Bus<span class="text-yellow-500">Direct</span>
          </h1>

          <p class="text-xs font-medium text-blue-950 sm:text-sm">
            Gestion des réservations
          </p>
        </div>
      </nav>
    </header>
    <main
      class="mx-auto w-full max-w-7xl flex-1 px-4 py-6 sm:px-6 lg:px-8">
    <div class="flex flex-row justify-between gap-1 rounded-lg bg-yellow-100 p-4 shadow-md text-blue-950 text-xs font-medium sm:text-sm">
      <p>Safi → Marrakech <span class="rounded-lg bg-blue-950   text-yellow-100 p-1 shadow-md ">80 DH/place</span></p>
      <span>🔴 Occupé 🟢 Disponible</span>
    </div>
    
    </main>

    <footer class="bg-yellow-100 shadow-inner">
      <div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
        <p class="text-center text-sm text-slate-500">
          &copy; 2026 BusDirect. Tous droits réservés.
        </p>
      </div>
    </footer>
  </body>
</html>
